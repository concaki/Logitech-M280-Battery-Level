name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install MinGW-w64
        run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64

      - name: Build
        run: make CC=x86_64-w64-mingw32-gcc

      - name: SHA-256
        run: sha256sum m280bat.exe | tee m280bat.exe.sha256

      - uses: actions/upload-artifact@v4
        with:
          name: m280bat
          path: |
            m280bat.exe
            m280bat.exe.sha256

      - name: Read version
        id: ver
        run: echo "tag=v$(tr -d ' \r\n' < VERSION)" >> "$GITHUB_OUTPUT"

      - name: Release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: |
            m280bat.exe
            m280bat.exe.sha256
          body: |
            Baixe o **m280bat.exe** abaixo e veja as instruções no [README](https://github.com/${{ github.repository }}#português).
            Download **m280bat.exe** below and see the [README](https://github.com/${{ github.repository }}#english) for instructions.
          make_latest: true
